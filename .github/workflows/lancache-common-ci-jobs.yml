name: build-and-test
run-name: "Build and Test"
on: [push]

jobs:
  dotnet-format:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/dotnet/sdk:8.0
    steps:
    - uses: actions/checkout@v3
      with:
        submodules: true
    - run: dotnet restore ./LancachePrefill.Common.sln
    - run: dotnet format ./LancachePrefill.Common.sln --verify-no-changes
    
  build-test:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/dotnet/sdk:8.0
    steps:
    - uses: actions/checkout@v3
      with:
        submodules: true
    - run: dotnet restore ./LancachePrefill.Common.sln
    - run: dotnet build ./LancachePrefill.Common.sln --no-restore --no-incremental -c Release /p:TreatWarningsAsErrors=true
    - run: dotnet test ./LancachePrefill.Common.sln --no-build -c Release
